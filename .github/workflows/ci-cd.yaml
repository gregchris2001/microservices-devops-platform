name: CI/CD Pipeline — Microservices DevOps Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger for deploy job

env:
  DOCKER_USERNAME: gregchris
  REGISTRY: docker.io

jobs:
  # ─── Job 1: Test Node.js Services ────────────────────────────────────────
  test-api:
    name: Test API Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api-service/package-lock.json

      - name: Install dependencies
        working-directory: ./api-service
        run: npm install

      - name: Run unit tests
        working-directory: ./api-service
        run: npm test

      - name: Run npm audit
        working-directory: ./api-service
        run: npm audit --audit-level=high || echo "⚠️  Audit warnings found"

  # ─── Job 2: Test Python Services ─────────────────────────────────────────
  test-python:
    name: Test Python Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install auth-service dependencies
        working-directory: ./auth-service
        run: pip install -r requirements.txt

      - name: Lint auth-service with flake8
        working-directory: ./auth-service
        run: |
          pip install flake8
          flake8 app.py --max-line-length=120 --ignore=E501,W503 || echo "Lint warnings"

      - name: Test auth-service health endpoint
        working-directory: ./auth-service
        run: |
          pip install pytest requests
          python -c "from app import app; client = app.test_client(); resp = client.get('/health'); assert resp.status_code == 200, 'Health check failed'; print('✅ Auth service health check passed')"

      - name: Install worker-service dependencies
        working-directory: ./worker-service
        run: pip install -r requirements.txt

  # ─── Job 3: Build Frontend ────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React app
        working-directory: ./frontend
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:3000
          CI: false

  # ─── Job 4: Build & Push Docker Images ───────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-api, test-python, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - name: api-service
            context: ./api-service
          - name: auth-service
            context: ./auth-service
          - name: frontend
            context: ./frontend
          - name: worker-service
            context: ./worker-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug image name
        run: |
          echo "Building image ${{ env.DOCKER_USERNAME }}/${{ matrix.service.name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Git metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKER_USERNAME }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 5: Security Scanning (Trivy) ────────────────────────────────────
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        image:
          - gregchris/api-service:latest
          - gregchris/auth-service:latest
          - gregchris/frontend:latest
          - gregchris/worker-service:latest

    steps:
      - name: Run Trivy vulnerability scanner on ${{ matrix.image }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

  # ─── Job 6: GitOps Deploy to Kubernetes ──────────────────────────────────
  deploy:
    name: Deploy to Kubernetes (GitOps)
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: kubectl cluster-info

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/postgres-service.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/redis-service.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/auth-deployment.yaml
          kubectl apply -f k8s/auth-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/worker-deployment.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Update image tags to latest SHA
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          kubectl set image deployment/api-service api-service=gregchris/api-service:sha-${SHA} -n devops-platform
          kubectl set image deployment/auth-service auth-service=gregchris/auth-service:sha-${SHA} -n devops-platform
          kubectl set image deployment/frontend frontend=gregchris/frontend:sha-${SHA} -n devops-platform
          kubectl set image deployment/worker-service worker-service=gregchris/worker-service:sha-${SHA} -n devops-platform

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/api-service -n devops-platform --timeout=3m
          kubectl rollout status deployment/auth-service -n devops-platform --timeout=3m
          kubectl rollout status deployment/frontend -n devops-platform --timeout=3m
          kubectl rollout status deployment/worker-service -n devops-platform --timeout=3m

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n devops-platform
          echo ""
          echo "=== Services ==="
          kubectl get svc -n devops-platform
          echo ""
          echo "=== Deployments ==="
          kubectl get deployments -n devops-platform
          echo ""
          echo "✅ Deployment completed successfully!"