apiVersion: v2
name: microservices-platform
description: A Helm chart for the Microservices DevOps Platform — includes frontend, api-service, auth-service, worker-service, Redis, and PostgreSQL.

type: application
version: 2.0.0
appVersion: "2.0.0"

keywords:
  - microservices
  - devops
  - kubernetes
  - platform

maintainers:
  - name: gregchris
    email: admin@example.com

dependencies:
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: postgresql
    version: "13.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
