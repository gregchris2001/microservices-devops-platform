# ─── Global Settings ──────────────────────────────────────────────────────────
global:
  namespace: devops-platform
  imageTag: "latest"
  imageRegistry: "docker.io"
  dockerUsername: "gregchris"

# ─── Frontend ─────────────────────────────────────────────────────────────────
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: gregchris/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: 32Mi
      cpu: 25m
    limits:
      memory: 64Mi
      cpu: 100m

# ─── API Service ──────────────────────────────────────────────────────────────
apiService:
  enabled: true
  replicaCount: 2
  image:
    repository: gregchris/api-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ─── Auth Service ─────────────────────────────────────────────────────────────
authService:
  enabled: true
  replicaCount: 2
  image:
    repository: gregchris/auth-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 250m
  secretKey: "supersecretkey-change-in-production"

# ─── Worker Service ───────────────────────────────────────────────────────────
workerService:
  enabled: true
  replicaCount: 1
  image:
    repository: gregchris/worker-service
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    username: admin
    password: password
    database: devopsdb
  primary:
    persistence:
      enabled: true
      size: 8Gi

# ─── Redis ────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: false

# ─── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: platform.local
  tls:
    enabled: false
    secretName: platform-tls-cert

# ─── Monitoring ───────────────────────────────────────────────────────────────
monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: true
