{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: auth-service
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.authService.replicaCount }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.authService.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: auth-service
        image: "{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.authService.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.authService.service.port }}
        resources:
          {{- toYaml .Values.authService.resources | nindent 10 }}
        env:
        - name: SECRET_KEY
          value: {{ .Values.authService.secretKey | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.authService.service.port }}
          initialDelaySeconds: 20
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.authService.service.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
  - protocol: TCP
    port: {{ .Values.authService.service.port }}
    targetPort: {{ .Values.authService.service.port }}
  type: {{ .Values.authService.service.type }}
{{- end }}
