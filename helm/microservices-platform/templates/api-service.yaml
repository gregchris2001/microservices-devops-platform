{{- if .Values.apiService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: api-service
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    managed-by: Helm
spec:
  replicas: {{ .Values.apiService.replicaCount }}
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.apiService.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api-service
        image: "{{ .Values.apiService.image.repository }}:{{ .Values.apiService.image.tag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.apiService.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.apiService.service.port }}
        resources:
          {{- toYaml .Values.apiService.resources | nindent 10 }}
        env:
        - name: DB_HOST
          value: "{{ .Release.Name }}-postgresql"
        - name: DB_USER
          value: {{ .Values.postgresql.auth.username }}
        - name: DB_PASSWORD
          value: {{ .Values.postgresql.auth.password }}
        - name: DB_NAME
          value: {{ .Values.postgresql.auth.database }}
        - name: REDIS_HOST
          value: "{{ .Release.Name }}-redis-master"
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.apiService.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.apiService.service.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: api-service
spec:
  selector:
    app: api-service
  ports:
  - protocol: TCP
    port: {{ .Values.apiService.service.port }}
    targetPort: {{ .Values.apiService.service.port }}
  type: {{ .Values.apiService.service.type }}
{{- end }}
{{- if .Values.apiService.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-service-hpa
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-service
  minReplicas: {{ .Values.apiService.hpa.minReplicas }}
  maxReplicas: {{ .Values.apiService.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.apiService.hpa.targetCPUUtilizationPercentage }}
{{- end }}
