server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            stream: stream
            attrs: attrs
            tag: attrs.tag
      - json:
          expressions:
            container_name: tag
          source: tag
      - regex:
          expression: "(?P<container_name>[^/]+)"
          source: container_name
      - labels:
          stream:
          container_name:
      - timestamp:
          format: RFC3339Nano
          source: time
      - output:
          source: log

  - job_name: api-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: api-service
          service: api-service
          __path__: /var/lib/docker/containers/*/*-json.log

  - job_name: auth-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth-service
          service: auth-service
          __path__: /var/lib/docker/containers/*/*-json.log
