apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: devops-platform
  labels:
    app: worker-service
    version: "2.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
        version: "2.0"
    spec:
      containers:
      - name: worker-service
        image: gregchris/worker-service:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        envFrom:
        - configMapRef:
            name: app-config
        # No liveness probe — worker is a background loop, not a web server.
        # It self-heals via its own Redis reconnection logic.
      restartPolicy: Always
      terminationGracePeriodSeconds: 30